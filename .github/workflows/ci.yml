name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./scripts/dotnet.sh build

      - name: Test
        run: ./scripts/dotnet.sh test --no-build

      - name: Docker build
        run: docker compose build api app
