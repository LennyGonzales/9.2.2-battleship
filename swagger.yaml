openapi: 3.0.3

info:
  title: BattleShip API
  version: 1.0.0
  description: |
    Contrat HTTP entre le front Blazor WebAssembly (BattleShip.App) et l'API
    ASP.NET Core (BattleShip.API).

    Regle de visibilite : aucune reponse ne revele la position d'un navire
    adverse qui n'a pas ete touche. La grille adverse n'expose que les cellules
    deja decouvertes par le joueur.

    Les statistiques de partie ne figurent pas ici : elles passent par gRPC-Web
    (service GameStats, voir Protos/battleship.proto).

servers:
  - url: http://localhost:8080
    description: API lancee via docker compose

tags:
  - name: Games
    description: Cycle de vie d'une partie
  - name: Fleet
    description: Placement des flottes
  - name: Boards
    description: Lecture des grilles
  - name: Shots
    description: Coups joues

paths:
  /api/games:
    post:
      tags: [Games]
      summary: Creer une partie
      description: |
        Cree une partie. Mode VsComputer (defaut) : retourne PlacingFleet avec
        une grille joueur vide ; le joueur place sa flotte via POST .../fleet.
        Mode VsPlayer : retourne Waiting et un token joueur 1 ; le second joueur
        rejoint via POST .../join. Les positions des navires ne sont jamais
        retournees dans les reponses de creation.
      operationId: createGame
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Partie creee
          headers:
            Location:
              description: URL de la partie creee
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GameDto'
                  - $ref: '#/components/schemas/GameCreatedDto'
        '400':
          $ref: '#/components/responses/ValidationProblem'

  /api/games/{id}/join:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      tags: [Games]
      summary: Rejoindre une partie multijoueur
      description: |
        Rejoint une partie PvP en attente. Cree la grille joueur 2 vide,
        retourne un token joueur 2 et passe en PlacingFleet. Chaque joueur
        place sa flotte via POST .../fleet. Indisponible si deja rejointe.
      operationId: joinGame
      responses:
        '200':
          description: Partie demarree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinGameDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [Games]
      summary: Lire l'etat d'une partie
      description: Retourne l'etat courant visible par le joueur.
      operationId: getGame
      responses:
        '200':
          description: Etat de la partie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/games/{id}/fleet:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/PlayerToken'
    post:
      tags: [Fleet]
      summary: Placer la flotte
      description: |
        Envoie la flotte complete du joueur (5 navires de la spec standard).

        PvE : pas de token ; autorise en PlacingFleet. Place la flotte joueur
        puis l'ordinateur automatiquement ; retourne PlayerTurn.

        PvP : X-Player-Token obligatoire. Joueur 1 peut placer en Waiting ou
        PlacingFleet ; joueur 2 uniquement apres join. La partie demarre
        (Player1Turn) quand les deux flottes sont placees.

        Placement invalide (chevauchement, navire manquant, hors grille) : 400.
        Flotte deja placee ou mauvais statut : 409.
      operationId: placeFleet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceFleetRequest'
      responses:
        '200':
          description: Flotte placee (partie demarree si conditions remplies)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/games/{id}/shots:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/PlayerToken'
    post:
      tags: [Shots]
      summary: Jouer un coup
      description: |
        Resout un seul tir selon le tour courant.

        PvE : PlayerTurn exige x,y ; ComputerTurn declenche le tir de
        l'ordinateur (body vide ou sans coordonnees). Le front enchaine
        deux appels si la partie continue.

        PvP : un tir par requete avec X-Player-Token.

        Un coup refuse ne modifie pas la partie : rejouer une case deja ciblee,
        mauvais tour ou tirer apres la fin de partie renvoie 409.
      operationId: fireShot
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShotRequest'
      responses:
        '200':
          description: Coup resolu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShotResultDto'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/games/{id}/board/player:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [Boards]
      summary: Lire la grille du joueur
      description: |
        Grille du joueur, avec ses propres navires et les tirs de l'ordinateur.
        Etats possibles : Empty, Ship, Hit, Sunk.
      operationId: getPlayerBoard
      responses:
        '200':
          description: Grille du joueur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/games/{id}/board/opponent:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [Boards]
      summary: Lire la grille adverse masquee
      description: |
        Grille de l'ordinateur telle que le joueur a le droit de la connaitre.
        Etats possibles : Unknown, Miss, Hit, Sunk. Aucune cellule ne revele un
        navire non touche.
      operationId: getOpponentBoard
      responses:
        '200':
          description: Grille adverse masquee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDto'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Identifiant de la partie
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    PlayerToken:
      name: X-Player-Token
      in: header
      required: false
      description: |
        Token joueur retourne a la creation (PvP) ou au join. Requis pour les
        routes shots et board en mode VsPlayer (a implementer).
      schema:
        type: string

  responses:
    ValidationProblem:
      description: Requete invalide (echec de validation FluentValidation)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    NotFound:
      description: Partie introuvable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Coup refuse ou partie deja terminee
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadRequest:
      description: Placement invalide ou requete incorrecte
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Token joueur manquant ou invalide (PvP)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    CreateGameRequest:
      type: object
      description: Options de creation. Toutes facultatives, valeurs par defaut appliquees.
      properties:
        boardSize:
          type: integer
          minimum: 5
          maximum: 20
          default: 10
          description: Cote de la grille carree
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        mode:
          $ref: '#/components/schemas/GameMode'
      example:
        boardSize: 10
        difficulty: Normal
        mode: VsComputer

    GameMode:
      type: string
      description: Mode de jeu
      enum: [VsComputer, VsPlayer]
      default: VsComputer

    Difficulty:
      type: string
      description: |
        Strategie de tir de l'ordinateur en PvE (ignore en PvP).
        Easy : tir aleatoire sur une case non jouee.
        Normal : priorite aux cases du damier (x + y pair), sinon aleatoire.
        Hard : chasse autour des cases touchees (Hit), puis Normal.
      enum: [Easy, Normal, Hard]
      default: Normal

    GameStatus:
      type: string
      description: |
        Etat de la partie.
        Waiting : partie PvP en attente du second joueur.
        PlacingFleet : placement des flottes en cours.
        PlayerTurn / ComputerTurn : partie PvE en cours.
        Player1Turn / Player2Turn : partie PvP en cours.
        PlayerWon / ComputerWon : fin PvE. Player1Won / Player2Won : fin PvP.
      enum:
        - Waiting
        - PlacingFleet
        - PlayerTurn
        - ComputerTurn
        - PlayerWon
        - ComputerWon
        - Player1Turn
        - Player2Turn
        - Player1Won
        - Player2Won

    Player:
      type: string
      description: |
        PvE : Player (humain), Computer (ordinateur).
        PvP : Player1, Player2.
      enum: [Player, Computer, Player1, Player2]

    ShotOutcome:
      type: string
      description: Resultat d'un tir
      enum: [Miss, Hit, Sunk, Obstacle]

    VisibleCellState:
      type: string
      description: |
        Etat d'une cellule tel que le joueur a le droit de le voir.
        Grille joueur : Empty, Ship, Hit, Sunk, Obstacle.
        Grille adverse : Unknown, Miss, Hit, Sunk, Obstacle (Obstacle uniquement apres un tir dessus).
      enum:
        - Unknown
        - Empty
        - Ship
        - Miss
        - Hit
        - Sunk
        - Obstacle

    BoardOwner:
      type: string
      enum: [Player, Opponent]

    GameDto:
      type: object
      description: Etat d'une partie visible par le joueur
      required: [id, mode, status, boardSize, shotCount]
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/GameMode'
        status:
          $ref: '#/components/schemas/GameStatus'
        currentTurn:
          allOf:
            - $ref: '#/components/schemas/Player'
          nullable: true
          description: Null lorsque la partie est terminee
        boardSize:
          type: integer
          description: Cote de la grille carree
        shotCount:
          type: integer
          description: Nombre de coups valides joues par le joueur
        createdAt:
          type: string
          format: date-time
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        mode: VsComputer
        status: PlacingFleet
        currentTurn: null
        boardSize: 10
        shotCount: 0
        createdAt: '2026-03-15T09:30:00Z'

    PlaceShipRequest:
      type: object
      required: [name, x, y, horizontal]
      properties:
        name:
          type: string
          description: Nom du navire (spec standard)
          enum:
            - Porte-avions
            - Croiseur
            - Contre-torpilleur
            - Sous-marin
            - Torpilleur
        x:
          type: integer
          minimum: 0
          description: Colonne de l'extremite du navire
        y:
          type: integer
          minimum: 0
          description: Ligne de l'extremite du navire
        horizontal:
          type: boolean
          description: true = horizontal, false = vertical

    PlaceFleetRequest:
      type: object
      required: [ships]
      properties:
        ships:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/PlaceShipRequest'

    GameCreatedDto:
      allOf:
        - $ref: '#/components/schemas/GameDto'
        - type: object
          properties:
            playerToken:
              type: string
              nullable: true
              description: Token joueur 1 en mode VsPlayer uniquement

    JoinGameDto:
      allOf:
        - $ref: '#/components/schemas/GameDto'
        - type: object
          required: [playerToken]
          properties:
            playerToken:
              type: string
              description: Token joueur 2

    CellDto:
      type: object
      required: [x, y, state]
      properties:
        x:
          type: integer
          minimum: 0
          description: Colonne, indexee a partir de 0
        y:
          type: integer
          minimum: 0
          description: Ligne, indexee a partir de 0
        state:
          $ref: '#/components/schemas/VisibleCellState'

    BoardDto:
      type: object
      description: |
        Grille et etats visibles. Le tableau cells contient size x size elements.
        Pour la grille adverse, aucune cellule n'a l'etat Ship.
      required: [owner, size, cells]
      properties:
        owner:
          $ref: '#/components/schemas/BoardOwner'
        size:
          type: integer
        cells:
          type: array
          items:
            $ref: '#/components/schemas/CellDto'
      example:
        owner: Opponent
        size: 10
        cells:
          - { x: 0, y: 0, state: Unknown }
          - { x: 1, y: 0, state: Miss }
          - { x: 2, y: 0, state: Hit }

    ShotRequest:
      type: object
      description: |
        Coordonnees du tir. Requises au tour humain (PlayerTurn, Player1Turn,
        Player2Turn). Absentes au tour ordinateur (ComputerTurn).
      properties:
        x:
          type: integer
          minimum: 0
          nullable: true
          description: Colonne ciblee, indexee a partir de 0
        y:
          type: integer
          minimum: 0
          nullable: true
          description: Ligne ciblee, indexee a partir de 0
      example:
        x: 4
        y: 7

    ShotOutcomeDto:
      type: object
      description: Resultat d'un tir unique
      required: [x, y, outcome]
      properties:
        x:
          type: integer
        y:
          type: integer
        outcome:
          $ref: '#/components/schemas/ShotOutcome'
        sunkShipName:
          type: string
          nullable: true
          description: Renseigne uniquement lorsque outcome vaut Sunk
      example:
        x: 4
        y: 7
        outcome: Sunk
        sunkShipName: Torpilleur

    ShotResultDto:
      type: object
      description: Resultat d'un tir unique et statut de la partie apres resolution.
      required: [shot, shooter, status]
      properties:
        shot:
          $ref: '#/components/schemas/ShotOutcomeDto'
        shooter:
          $ref: '#/components/schemas/Player'
        status:
          $ref: '#/components/schemas/GameStatus'
      example:
        shot:
          x: 4
          y: 7
          outcome: Hit
          sunkShipName: null
        shooter: Player
        status: ComputerTurn

    ProblemDetails:
      type: object
      description: Reponse d'erreur au format RFC 7807
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      example:
        type: https://tools.ietf.org/html/rfc9110#section-15.5.5
        title: Not Found
        status: 404
        detail: Partie inconnue

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              description: Messages de validation par champ
              additionalProperties:
                type: array
                items:
                  type: string
          example:
            title: One or more validation errors occurred.
            status: 400
            errors:
              x:
                - 'La colonne doit etre comprise entre 0 et 9.'
